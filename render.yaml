# Render Blueprint: one free Node web service, rebuilt on every push to main.
# The menu edited in /admin is committed to the menu-data branch (not deployed from), so edits survive redeploys.
services:
  - type: web
    name: chez-moi-karakoy
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: GITHUB_REPO
        value: kufuank/chez-moi-karakoy
      - key: GITHUB_MENU_BRANCH
        value: menu-data
      - key: GITHUB_TOKEN
        sync: false
