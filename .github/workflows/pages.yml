# Builds the static site and publishes it to GitHub Pages.
# Runs on every push to main, on demand, and once a night so the menu written into the pages stays fresh
# for search engines (visitors always get live data from Supabase anyway).
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: node build.mjs
        env:
          # "/chez-moi-karakoy" on github.io; empty once a custom domain is set
          BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
